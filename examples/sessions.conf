# ~/.config/agents/sessions.conf
# project | name | dir | model | session id
# Empty model = your default. Empty id = a new session; agents writes its id back.
webapp | Developer | ~/src/webapp |        | 00000000-0000-4000-8000-000000000000
webapp | QA        | ~/src/webapp | sonnet |
# extra args (6th column) go to claude as written, e.g. an on-call session:
duty   | Duty      | ~/duty       | haiku  |  | --remote-control Duty "Start the shift: run Monitor on bin/ntfy-listen."
